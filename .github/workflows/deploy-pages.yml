name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy site files
        run: |
          mkdir out
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='*.yml' --exclude='package-lock.json' --exclude='package.json' ./ out/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
